name: Windows signed release (requires approved signing account)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gamepanel-production-signing
  cancel-in-progress: false

jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: signing
    env:
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG }}
      SIGNPATH_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_CONFIGURATION_SLUG }}
      SIGNPATH_EXPECTED_SUBJECT: ${{ vars.SIGNPATH_EXPECTED_SUBJECT }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - name: Require approved production-signing configuration
        shell: pwsh
        run: |
          foreach ($name in @('SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_POLICY_SLUG', 'SIGNPATH_CONFIGURATION_SLUG', 'SIGNPATH_EXPECTED_SUBJECT', 'SIGNPATH_API_TOKEN')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Signing is not configured ($name). Complete provider approval and the signing environment first. No unsigned fallback."
            }
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - name: Build and test source
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Test the desktop flow
        shell: powershell
        run: ./scripts/check-startup.ps1 -ExecutablePath ./artifacts/GamePanel-win-x64/GamePanel.exe
      - name: Upload source package for the trusted build connector
        id: signing-input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GamePanel-signing-input
          path: artifacts/GamePanel-win-x64/
          retention-days: 1
          if-no-files-found: error
      - name: Request approved production signatures
        uses: SignPath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.signing-input.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/GamePanel-signed
      - name: Verify signatures, publisher, timestamp and exact package
        shell: pwsh
        run: ./scripts/verify-signed-package.ps1 -UnsignedDirectory ./artifacts/GamePanel-win-x64 -SignedDirectory ./artifacts/GamePanel-signed -ExpectedPublisher $env:SIGNPATH_EXPECTED_SUBJECT
      - name: Signed portable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GamePanel-win-x64-signed
          path: artifacts/GamePanel-signed/
          if-no-files-found: error
