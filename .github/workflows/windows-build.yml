name: Windows portable alpha

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned 2026-10-29
        with:
          persist-credentials: false
      - name: SDK from global.json
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4, pinned 2026-10-29
        with:
          global-json-file: global.json
      - name: Checks and self-contained Windows build
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Check desktop startup
        shell: powershell
        run: ./scripts/check-startup.ps1 -ExecutablePath ./artifacts/GamePanel-win-x64/GamePanel.exe -PreviewDirectory ./artifacts/ui-preview
      - name: Verify that unsigned files cannot pass the production-signing gate
        shell: pwsh
        run: ./scripts/check-signature-gate.ps1 -PackageDirectory ./artifacts/GamePanel-win-x64
      - name: Interface screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GamePanel-interface-preview
          path: artifacts/ui-preview/
          if-no-files-found: error
      - name: Portable package and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, pinned 2026-10-29
        with:
          name: GamePanel-win-x64-alpha
          path: artifacts/GamePanel-win-x64/
          if-no-files-found: error
