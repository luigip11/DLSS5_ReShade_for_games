name: Windows portable alpha

on:
  workflow_dispatch:
  push:
    branches: [main, 'release/*']
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned 2026-10-29
        with:
          persist-credentials: false
      - name: SDK from global.json
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4, pinned 2026-10-29
        with:
          global-json-file: global.json
      - name: Python for reproducible original texture assets
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 pinned
        with:
          python-version: '3.12.10'
      - name: Build original 2K asphalt pack from pinned MIT source
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r scripts/AsphaltPackBuild/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Texture builder dependency install failed.' }
          python scripts/AsphaltPackBuild/build_pack.py --output artifacts/asphalt-pack-build --dotnet dotnet
          if ($LASTEXITCODE -ne 0) { throw 'Texture pack build failed.' }
          $path = './artifacts/asphalt-pack-build/GamePanel-AsphaltHD.zip'
          if ((Get-Item $path).Length -ne 8397130 -or (Get-FileHash $path -Algorithm SHA256).Hash -ne '45fe214ba832782c2f46ed32265f5428bf34e82ac0c7bc3f1b5c4d9c11e3d67a') { throw 'Original pack reproducibility check failed.' }
      - name: Inspect official ReShade source package without executing it
        shell: pwsh
        run: ./scripts/inspect-reshade.ps1
      - name: Build original DDS material for DirectX pilot
        shell: pwsh
        run: |
          python scripts/AsphaltPackBuild/build_directx_sample.py --output src/GamePanel.Desktop/Assets/DirectXAsphalt
          if ($LASTEXITCODE -ne 0) { throw 'DirectX material build failed.' }
          $sample = 'src/GamePanel.Desktop/Assets/DirectXAsphalt/Asphalt.dds'
          if ((Get-Item $sample).Length -ne 2796344 -or (Get-FileHash $sample -Algorithm SHA256).Hash -ne '7adaf63cc2234e6dc29ab87faa01fbc273523580ab14ef30e52babfe1a04e98f') { throw 'DirectX material reproducibility check failed.' }
      - name: Checks and self-contained Windows build
        shell: pwsh
        run: ./scripts/publish.ps1 -VerifyOfficialComponent
      - name: Check DDS preview pixels and bounds on Windows
        shell: pwsh
        run: |
          dotnet restore tests/GamePanel.DesktopChecks --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Desktop check restore failed.' }
          dotnet run --project tests/GamePanel.DesktopChecks -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'DDS preview checks failed.' }
      - name: Check native updater and preservation of user data
        shell: pwsh
        run: ./scripts/check-updater.ps1 -PackageDirectory ./artifacts/GamePanel-win-x64
      - name: Create non-executable static texture compatibility fixture
        shell: pwsh
        run: dotnet run --project tests/GamePanel.Checks -c Release --no-restore -- --write-asset-fixture ./artifacts/asset-fixture/speed2.exe
      - name: Compile synthetic DX9 x86 fixture
        shell: pwsh
        run: ./scripts/build-graphics-fixture.ps1
      - name: Verify Explorer launch directory and environment isolation
        shell: pwsh
        run: |
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class DesktopShellProbe { [DllImport("user32.dll")] public static extern IntPtr GetShellWindow(); }'
          if ([DesktopShellProbe]::GetShellWindow() -eq [IntPtr]::Zero) {
            Start-Process explorer.exe
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            while ([DesktopShellProbe]::GetShellWindow() -eq [IntPtr]::Zero -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Milliseconds 200 }
          }
          dotnet run --project tests/GamePanel.DesktopChecks -c Release --no-restore -- --explorer-probe ./artifacts/graphics-fixture/speed2.exe
          if ($LASTEXITCODE -ne 0) { throw 'Explorer launch broker check failed.' }
      - name: Check desktop startup
        shell: powershell
        run: ./scripts/check-startup.ps1 -ExecutablePath ./artifacts/GamePanel-win-x64/GamePanel.exe -PreviewDirectory ./artifacts/ui-preview -GraphicsFixturePath ./artifacts/graphics-fixture/speed2.exe -AssetFixturePath ./artifacts/asset-fixture/speed2.exe -AssetPackagePath ./artifacts/asphalt-pack-build/GamePanel-AsphaltHD.zip
      - name: Verify that unsigned files cannot pass the production-signing gate
        shell: pwsh
        run: ./scripts/check-signature-gate.ps1 -PackageDirectory ./artifacts/GamePanel-win-x64
      - name: Probe actual DirectX capture and replacement when an adapter exists
        shell: pwsh
        run: ./scripts/check-directx-textures.ps1 -OutputDirectory ./artifacts/directx-texture-probe
      - name: DirectX runtime evidence and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GamePanel-DirectX-runtime-evidence
          path: artifacts/directx-texture-probe/
          if-no-files-found: warn
      - name: Interface screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GamePanel-interface-preview
          path: artifacts/ui-preview/
          if-no-files-found: error
      - name: Original texture pack and source verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GamePanel-original-asphalt-pack
          path: |
            artifacts/asphalt-pack-build/GamePanel-AsphaltHD.zip
            artifacts/asphalt-pack-build/pack-verification.json
            artifacts/asphalt-pack-build/source-pins.json
          if-no-files-found: error
      - name: Portable package and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, pinned 2026-10-29
        with:
          name: GamePanel-win-x64-alpha
          path: artifacts/GamePanel-win-x64/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    needs: portable
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tested release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download verified portable artifact from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 pinned
        with:
          name: GamePanel-win-x64-alpha
          path: artifacts/release-package
      - name: Download tested original texture pack
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: GamePanel-original-asphalt-pack
          path: artifacts/asphalt-release
      - name: Publish versioned release and update metadata
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.ps1 -PackageDirectory ./artifacts/release-package -AsphaltPackagePath ./artifacts/asphalt-release/GamePanel-AsphaltHD.zip
